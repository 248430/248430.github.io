
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haruto | Portfolio B</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101116;
      color: #f0f0f5;
      font-family: Arial, sans-serif;
      line-height: 1.8;
    }
    header {
      text-align: center;
      padding: 90px 20px;
      background: linear-gradient(135deg, #17172d, #29204a);
    }
    header h1 {
      font-size: 54px;
      color: #a78bfa;
      margin: 0;
    }
    header p { color: #c8c4dd; }
    main {
      max-width: 900px;
      margin: 45px auto;
      padding: 0 20px;
    }
    section {
      background: #1d1e29;
      border: 1px solid #343449;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 25px;
    }
    h2 {
      color: #b69aff;
      border-left: 4px solid #8b5cf6;
      padding-left: 15px;
    }
    .tags {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .tag {
      border: 1px solid #8b5cf6;
      border-radius: 8px;
      padding: 8px 18px;
      color: #d5c5ff;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #9292a6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Haruto</h1>
    <p>IT / CG / PROGRAMMING</p>
    <p>大学3年生・情報系</p>
  </header>
  <main>
    <section>
      <h2>ABOUT ME</h2>
      <p>名前：Haruto</p>
      <p>所属：大学3年生</p>
      <p>専攻：情報系</p>
    </section>
    <section>
      <h2>INTERESTS</h2>
      <div class="tags">
        <span class="tag">IT</span>
        <span class="tag">CG</span>
        <span class="tag">プログラミング</span>
      </div>
    </section>
    <section>
      <h2>HOBBIES</h2>
      <p>ゲーム・パソコン</p>
    </section>
    <section>
      <h2>SKILLS</h2>
      <div class="tags">
        <span class="tag">Java</span>
        <span class="tag">Python</span>
        <span class="tag">HTML</span>
        <span class="tag">CSS</span>
      </div>
    </section>
    <section>
      <h2>FUTURE GOAL</h2>
      <p>大学で学んだITの知識を活かして、IT業界で活躍したいです。</p>
    </section>
  </main>
  <footer>Haruto Portfolio</footer>
</body>
</html>
